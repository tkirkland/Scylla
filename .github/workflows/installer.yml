name: Installer

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    name: Build x64 installer
    runs-on: windows-latest
    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Read version
        id: version
        shell: bash
        run: |
          version=$(sed -nE 's/^[[:space:]]*VERSION ([0-9.]+).*/\1/p' CMakeLists.txt | head -1)
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Configure CMake
        shell: bash
        run: cmake -B build -A x64 -DSCYLLA_PYTHON=OFF

      - name: Build
        shell: bash
        run: cmake --build build --config Release

      - name: Install Inno Setup
        shell: pwsh
        run: |
          if (-not (Get-Command iscc -ErrorAction SilentlyContinue) -and
              -not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup -y --no-progress
          }

      - name: Build installer
        shell: pwsh
        run: |
          $iscc = (Get-Command iscc -ErrorAction SilentlyContinue).Source
          if (-not $iscc) { $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" }
          & $iscc /DAppVersion=${{ steps.version.outputs.version }} installer\Scylla.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload installer
        uses: actions/upload-artifact@v7
        with:
          name: Scylla-${{ steps.version.outputs.version }}-x64-setup
          path: dist/*.exe
          retention-days: 7

  release:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    # Every push to main publishes a build release; pushing a v* tag publishes that tag.
    if: github.event_name == 'push'
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            tag="$GITHUB_REF_NAME"
          else
            tag="v${VERSION}-build.${GITHUB_RUN_NUMBER}"
          fi
          gh release create "$tag" dist/*.exe \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Scylla $tag" \
            --generate-notes \
            --latest
